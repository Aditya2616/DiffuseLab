[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diffuselab"
version = "0.1.0"
description = "Instrumented diffusion sampler and explainer: record and scrub every denoising step."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aditya Jain" }]
dependencies = [
  "torch>=2.4",
  "diffusers>=0.35",
  "huggingface-hub>=1.5,<2",
  "numpy>=1.26",
  "pillow>=10",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27", "playwright>=1.40"]
metrics = ["torch-fidelity>=0.4", "torchvision"]  # FID/KID (scripts/eval_fid.py); install torchvision to match your torch

[project.scripts]
diffuselab = "diffuselab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs a downloaded model or a GPU (deselect with -m 'not slow')"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 125
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]
